<div class="login-page">
  <div class="auth-card">
    <div class="auth-header">
      <svg class="logo" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" fill="#1a73e8"/></svg>
      <h2>Crear una cuenta</h2>
      <p>para usar Tyrak Box</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <input type="text" id="username" formControlName="username" class="form-control" placeholder=" " required>
        <label for="username">Nombre de usuario</label>
      </div>

      <div class="form-group">
        <input type="email" id="email" formControlName="email" class="form-control" placeholder=" " required>
        <label for="email">Correo electrónico</label>
      </div>

      <div class="form-group">
        <input type="password" id="password" formControlName="password" class="form-control" placeholder=" " required>
        <label for="password">Contraseña</label>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <span>{{ errorMessage }}</span>
      </div>

      <div class="form-actions">
        <a routerLink="/login" class="link">Iniciar sesión</a>
        <button type="submit" class="btn btn-primary" [disabled]="registerForm.invalid || isLoading">
          {{ isLoading ? 'Creando...' : 'Siguiente' }}
        </button>
      </div>
    </form>
  </div>
</div>
