<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="var(--primary-color)">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z"></path>
        </svg>
      </div>
      <h2>Iniciar Sesión</h2>
      <p>Continúa a Tyrak Box</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <input
          type="text"
          id="username"
          formControlName="username"
          class="form-control"
          placeholder=" "
          required>
        <label for="username">Nombre de usuario</label>
      </div>

      <div class="form-group">
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          placeholder=" "
          required>
        <label for="password">Contraseña</label>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"></path>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <div class="form-actions">
        <a routerLink="/register" class="register-link">Crear cuenta</a>
        <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || isLoading">
          {{ isLoading ? 'Iniciando...' : 'Siguiente' }}
        </button>
      </div>
    </form>
  </div>
</div>
