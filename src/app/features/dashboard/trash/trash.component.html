<div class="trash-container">
  <div class="header-actions">
    <h1>Papelera</h1>
    <button class="btn btn-danger" (click)="emptyTrash()" [disabled]="folders.length === 0 && files.length === 0">
      Vaciar Papelera
    </button>
  </div>

  <div *ngIf="isLoading" class="loading-state">
    <div class="spinner"></div>
    <p>Cargando contenido...</p>
  </div>

  <div *ngIf="!isLoading && folders.length === 0 && files.length === 0" class="empty-state">
    <h3>La papelera está vacía</h3>
  </div>

  <div *ngIf="!isLoading && (folders.length > 0 || files.length > 0)" class="content-list">
    <div class="list-header">
      <div class="name-col">Nombre</div>
      <div class="date-col">Fecha de eliminación</div>
      <div class="actions-col"></div>
    </div>
    <div class="list-item" *ngFor="let folder of folders">
      <div class="name-col">
        <svg class="icon" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"></path></svg>
        <span>{{ folder.name }}</span>
      </div>
      <div class="date-col">{{ folder.createdAt | date:'short' }}</div>
      <div class="actions-col">
        <button class="btn-icon" (click)="restoreItem(folder, 'folder')" title="Restaurar">
          <svg viewBox="0 0 24 24"><path d="M14 10H2v2h12v-2zm0-4H2v2h12V6zm4 8v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM2 16h8v-2H2v2z"></path></svg>
        </button>
      </div>
    </div>
    <div class="list-item" *ngFor="let file of files">
      <div class="name-col">
        <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"></path></svg>
        <span>{{ file.name }}</span>
      </div>
      <div class="date-col">{{ file.createdAt | date:'short' }}</div>
      <div class="actions-col">
        <button class="btn-icon" (click)="restoreItem(file, 'file')" title="Restaurar">
          <svg viewBox="0 0 24 24"><path d="M14 10H2v2h12v-2zm0-4H2v2h12V6zm4 8v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM2 16h8v-2H2v2z"></path></svg>
        </button>
      </div>
    </div>
  </div>
</div>
